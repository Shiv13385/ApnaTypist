<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login – Apna Typist</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#12141c;color:#fff;font-family:Arial,sans-serif}.card{background:#1a1d29;border:1px solid #2b3040;border-radius:16px}.form-control,.form-select{background:#10131b;color:#fff;border:1px solid #3b4254}.form-control:focus,.form-select:focus{background:#10131b;color:#fff;border-color:#10b981;box-shadow:0 0 0 .2rem rgba(16,185,129,.15)}.btn-green{background:#10b981;color:#fff;border:0}.btn-green:hover{background:#0ea371;color:#fff}.muted{color:#a8afbd}.price{font-size:1.4rem;font-weight:700;color:#10b981}.navbar{background:#0d0f15!important}.table{--bs-table-bg:#1a1d29;--bs-table-color:#fff}.qr{max-width:260px;border-radius:12px;background:#fff;padding:10px}.badge-soft{background:#263040;color:#fff}</style></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Apna Typist</a><div><a class="btn btn-sm btn-outline-light me-2" href="{{ url_for('payment') }}">Place Order</a><a class="btn btn-sm btn-outline-light" href="{{ url_for('track') }}">Track Order</a></div></div></nav><main class="container py-5">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<div class="row justify-content-center"><div class="col-md-5"><div class="card p-4"><h2 class="text-center">Admin Login</h2><p class="muted text-center">Enter your ADMIN_KEY.</p><form method="POST"><input type="password" name="key" class="form-control mb-3" placeholder="Admin Key" required><button class="btn btn-green w-100">Login</button></form></div></div></div></main></body></html>
